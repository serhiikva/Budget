name: Deploy release to Firebase App Distribution

env:
  VERSION_CODE: ${{ github.run_number }}

on:
  push:
    branches: [ beta ]

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore
        run: |
          echo "${{ secrets.STORE_FILE }}" | base64 -d > app/prod_keystore

      - name: Create keystore.properties
        run: |
          cat <<EOF > keystore.properties
          STORE_FILE=prod_keystore
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Run unit tests
        run: ./gradlew check

  distribute:
    name: Distribute apk to Firebase
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Restore keystore
        run: |
          echo "${{ secrets.STORE_FILE }}" | base64 -d > app/prod_keystore

      - name: Create keystore.properties
        run: |
          cat <<EOF > keystore.properties
          STORE_FILE=prod_keystore
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Restore Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json

      - name: Get versionName from Gradle
        id: version
        run: |
          VERSION=$(./gradlew -q printVersionName)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          git log -10 --pretty=format:"- %s" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload beta build
        run: |
          ./gradlew assembleBetaRelease appDistributionUploadBetaRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json

      - name: Create git tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG="v$VERSION"
                
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
                
          git tag $TAG
          git push origin $TAG