name: Deploy release to Firebase App Distribution

on:
  push:
    branches: [ beta ]

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore keystore
        run: |
          echo "${{ secrets.STORE_FILE }}" | base64 -d > app/prod_keystore

      - name: Create keystore.properties
        run: |
          cat <<EOF > keystore.properties
          STORE_FILE=prod_keystore
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Run unit tests
        run: ./gradlew check

  distribute:
    name: Distribute apk to Firebase
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Restore keystore
        run: |
          echo "${{ secrets.STORE_FILE }}" | base64 -d > app/prod_keystore

      - name: Create keystore.properties
        run: |
          cat <<EOF > keystore.properties
          STORE_FILE=prod_keystore
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Restore Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Upload beta build
        run: ./gradlew assembleBetaRelease appDistributionUploadBetaRelease
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json